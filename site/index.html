<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qui a voté quoi</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="description" content="Pour chaque texte examiné à l'Assemblée nationale : qui l'a proposé, ce qu'il change, et ce que chaque groupe de députés a voté.">
<!-- Version de test : pas d'indexation par les moteurs de recherche -->
<meta name="robots" content="noindex, nofollow">
<style>
/* Polices hébergées sur le site : aucune donnée de visite n'est transmise à un tiers */
@font-face { font-family: "Bricolage Grotesque"; font-weight: 500 800; font-display: swap; src: url(polices/bricolage-grotesque.woff2) format("woff2"); }
@font-face { font-family: "Source Sans 3"; font-weight: 200 900; font-display: swap; src: url(polices/source-sans-3.woff2) format("woff2"); }
/* Base commune (direction « civique et chaleureux ») : fond crème, encre violette, un violet et un corail de marque
   qu'aucun groupe n'utilise ; les couleurs des groupes restent réservées à leurs pastilles. Une colonne de 960 px. */
:root {
  --bg: #fbf8f3; --surface: #ffffff; --fg: #231a33; --muted: #5c5270; --line: #e4dcec; --encre: #231a33;
  --accent: #5b3fd9; --accent-soft: #ede7ff; --on-accent: #ffffff; --corail: #d9541f;
  --soutien: #1a7f5a; --opposition: #c23b22; --abst: #8a6200; --absent: #ddd6e6; --seat-absent: #ddd6e6; --trait: #8f85a3;
  --jauge-pour: #5cbf93; --jauge-contre: #ef8a74; --jauge-abst: #e7c25e;
  --ok-soft: #d8f3e7; --ok-fg: #0f5e42; --ko-soft: #ffe2da; --ko-fg: #9a2a14; --loi-soft: #ede7ff; --serre-soft: #fff0c2; --serre-fg: #6b4300;
  --rayon: 18px; --rayon-s: 12px; --bord: 1.5px solid var(--line); --bord-encre: 1.5px solid var(--encre); --ombre: 3px 3px 0 var(--encre);
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #16121e; --surface: #201a2b; --fg: #f2edf9; --muted: #b6abc9; --line: #3a314a; --encre: #8f84a6;
    --accent: #ab98ff; --accent-soft: #2c2445; --on-accent: #16121e; --corail: #ff8d68;
    --soutien: #4fc497; --opposition: #ff8a70; --abst: #e2b852; --absent: #3e3550; --seat-absent: #3e3550; --trait: #8f84a6;
    --jauge-pour: #3f9f78; --jauge-contre: #d9735f; --jauge-abst: #c9a24a;
    --ok-soft: #183a2d; --ok-fg: #9be6c6; --ko-soft: #43211b; --ko-fg: #ffb8a6; --loi-soft: #2c2445; --serre-soft: #3e3214; --serre-fg: #f3d27a;
    color-scheme: dark; }
}
* { box-sizing: border-box; }
html { scroll-padding-top: 90px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.skip { position: absolute; left: 8px; top: -60px; z-index: 20; background: var(--accent); color: var(--on-accent); padding: 10px 16px; border-radius: 6px; font-weight: 700; }
.skip:focus { top: 8px; }
main:focus, h1:focus { outline: none; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.5 var(--body); }
a { color: var(--accent); }
.wrap { max-width: 960px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
footer.pied { border-top: var(--bord); background: var(--bg); }
footer.pied .wrap { display: flex; flex-wrap: wrap; gap: 8px 20px; padding-block: 20px; font-size: 15px; color: var(--muted); }
footer.pied a { display: inline-block; padding-block: 2px; }
.apropos h2 { font-size: 21px; }
/* Filtres : une grille de trois colonnes égales ; la recherche et le choix des sujets prennent toute la largeur */
.filtres { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-top: 24px; background: var(--surface); border: var(--bord); border-radius: var(--rayon); padding: 18px; }
.filtres > .champ, .filtres > .choix-sujets { grid-column: 1 / -1; }
.filtres-vote { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.bilan .filtres { margin-top: 0; }
.filtres label, .filtres legend { display: block; font: 700 13px var(--body); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; padding: 0; }
.filtres input[type=search], .filtres select { display: block; width: 100%; height: 46px; font: 16px var(--body); color: var(--fg); background-color: var(--surface); border: var(--bord); border-radius: var(--rayon-s); padding: 0 14px; }
.recherche input[type=search] { border: var(--bord-encre); border-radius: 999px; box-shadow: var(--ombre); }
.filtres input[type=search]:hover, .filtres select:hover { border-color: var(--trait); }
.filtres input[type=search]:focus-visible, .filtres select:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
/* Listes déroulantes au même style que le champ, avec un chevron dessiné en CSS (suit le thème clair ou sombre) */
.filtres select { appearance: none; -webkit-appearance: none; padding-right: 36px; text-overflow: ellipsis; white-space: nowrap; overflow: hidden; cursor: pointer;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 19px) 19px, calc(100% - 14px) 19px; background-size: 5px 5px; background-repeat: no-repeat; }
.recherche { position: relative; }
.recherche svg { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.recherche input[type=search] { padding-left: 42px; }
.choix-sujets { border: 0; padding: 0; margin: 0; min-width: 0; }
.choix-sujets .cases { display: flex; flex-wrap: wrap; gap: 8px; }
.filtres .choix-sujets label { display: inline-flex; align-items: center; gap: 8px; font: 600 15px var(--body); text-transform: none; letter-spacing: normal; color: var(--fg); margin: 0; padding: 6px 14px; min-height: 44px; border: var(--bord); border-radius: 999px; background: var(--surface); cursor: pointer; }
.filtres .choix-sujets label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.choix-sujets input { width: 18px; height: 18px; accent-color: var(--accent); }
.choix-sujets legend { display: flex; width: 100%; justify-content: space-between; align-items: baseline; gap: 12px; }
.choix-sujets .nb-sujet { white-space: nowrap; font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }
/* Sur téléphone, des pastilles plus petites : la liste tient en un écran et demi au lieu de trois */
@media (max-width: 640px) {
  .choix-sujets .cases { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .filtres .choix-sujets label { font-size: 14px; line-height: 1.2; padding: 6px 10px; min-height: 40px; gap: 6px; border-radius: var(--rayon-s); }
  .choix-sujets input { flex: none; }
  .choix-sujets input { width: 16px; height: 16px; }
}
.lien-bouton { font: inherit; color: var(--accent); background: none; border: 0; padding: 4px 0; text-decoration: underline; cursor: pointer; }
.plus { font: 700 16px var(--body); color: var(--fg); background: var(--surface); border: var(--bord-encre); border-radius: 999px; padding: 10px 20px; min-height: 44px; cursor: pointer; }
.plus:hover { box-shadow: var(--ombre); }
/* Liste de textes : le même composant partout (accueil, textes, recherche, fiche groupe) ; une carte par texte, groupées par mois */
.liste-textes .mois { font: 700 13px var(--body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 18px 0 8px; }
.liste-textes .mois:first-child { margin-top: 4px; }
.lignes { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.ligne { display: grid; gap: 6px; padding: 13px 18px; background: var(--surface); border: var(--bord); border-radius: var(--rayon); transition: transform .12s, box-shadow .12s, border-color .12s; }
.ligne:hover { transform: translate(-2px, -2px); border-color: var(--encre); box-shadow: var(--ombre); }
.ligne-haut { display: flex; justify-content: space-between; align-items: flex-start; gap: 6px 12px; }
.ligne-haut .tag { flex: none; margin-top: 2px; }
.ligne h3 { font: 700 17px/1.3 var(--display); }
.ligne h3 a { color: var(--fg); text-decoration: none; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; }
.ligne h3 a:hover { color: var(--accent); text-decoration: underline; }
.ligne-bas { display: flex; align-items: center; gap: 4px 14px; flex-wrap: wrap; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.auteur { display: inline-flex; align-items: center; gap: 5px; font-weight: 700; color: var(--fg); text-decoration: none; }
a.auteur:hover { text-decoration: underline; }
.badge-relu { font: 700 11px var(--body); color: var(--ok-fg); background: var(--ok-soft); border-radius: 999px; padding: 1px 7px; vertical-align: 2px; }
.note-ia { font-size: 14px; color: var(--muted); margin: 0 0 8px; }
/* Ancienne carte de texte (gardée pour les cartes de journée) */
.carte { background: var(--surface); border-radius: var(--rayon); padding: 14px 18px; display: grid; gap: 8px; }
.carte-haut { display: flex; justify-content: space-between; align-items: flex-start; gap: 6px 12px; }
.carte-haut .tag { margin-top: 3px; flex: none; }
.carte-date { margin-left: auto; font-size: 14px; }
.carte h3 { font-size: 18px; line-height: 1.3; }
/* Deux lignes au plus dans une liste (le titre complet reste dans la page et sur la fiche) */
.carte h3 a { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; }
.carte h3 { display: flex; align-items: baseline; gap: 6px; }
.carte h3 .badge-ia { margin-left: 0; flex: none; }
.carte h3 a { text-decoration: none; color: var(--fg); }
.carte h3 a:hover { text-decoration: underline; color: var(--accent); }
.carte-bas { display: flex; align-items: center; gap: 4px 16px; flex-wrap: wrap; font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }
.serre { background: var(--serre-soft); color: var(--serre-fg); font-weight: 600; border-radius: 999px; padding: 1px 9px; margin-left: 6px; }
/* Mini-jauge : la proportion pour / contre d'un coup d'œil, à la taille d'un badge (la grande jauge est sur la fiche) */
.decompte { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.minijauge .bar { width: 52px; height: 8px; border-radius: 4px; }
.mesures { margin-top: 20px; display: grid; gap: 6px; }
.mesures ul { margin: 0; padding-left: 20px; display: grid; gap: 2px; font-size: 18px; }
.repartition { display: grid; gap: 6px; margin-top: 10px; }
.repartition div { display: grid; grid-template-columns: 2.5em minmax(0, 1fr); gap: 10px; align-items: baseline; }
.repartition b { text-align: right; font-variant-numeric: tabular-nums; font-size: 18px; }
.badge-ia { display: inline-block; vertical-align: 3px; margin-left: 6px; font: 700 11px var(--body); letter-spacing: .05em; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 1px 7px; cursor: help; } .apropos p, .apropos li { max-width: 70ch; }
header.top { background: var(--bg); border-bottom: var(--bord); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
header.top .wrap { display: flex; align-items: center; gap: 20px; padding-block: 12px; }
.logo { font: 800 21px var(--display); text-decoration: none; color: var(--fg); margin-right: auto; white-space: nowrap; display: inline-flex; align-items: center; gap: 8px; }
.logo svg { flex: none; }
nav { display: flex; gap: 6px; }
nav a { text-decoration: none; color: var(--fg); font-weight: 600; padding: 6px 14px; border: 1.5px solid transparent; border-radius: 999px; white-space: nowrap; }
nav a:hover { border-color: var(--line); }
nav a.on { background: var(--fg); color: var(--bg); }
main { padding-block: 32px 64px; }
h1, h2, h3 { font-family: var(--display); font-weight: 800; line-height: 1.1; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(30px, 5.5vw, 46px); letter-spacing: -.01em; }
h3 { font-weight: 700; }
h2 { font-size: 24px; margin-top: 44px; margin-bottom: 14px; }
h3 { font-size: 19px; }
.lead { font-size: 19px; color: var(--muted); max-width: 62ch; margin: 12px 0 0; }
.eyebrow { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
.meta { color: var(--muted); font-size: 15px; }
.note { font-size: 14px; color: var(--muted); margin-top: 24px; max-width: 75ch; }
.back { display: inline-block; margin-bottom: 16px; text-decoration: none; font-weight: 600; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.list { display: grid; gap: 12px; }
.card { background: var(--surface); border: var(--bord); border-radius: var(--rayon); padding: 16px 18px; text-decoration: none; color: var(--fg); display: grid; gap: 10px; }
/* Éléments cliquables (carte de texte, porte, carte de journée) : contour clair ; au survol, contour encre et soulèvement */
.carte, .door, a.card { border: var(--bord); transition: transform .12s, box-shadow .12s, border-color .12s; }
.carte:hover, .door:hover, a.card:hover { transform: translate(-2px, -2px); border-color: var(--encre); box-shadow: var(--ombre); }

/* Partis : pastille claire (lien) et badge plein (identité) */
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; padding: 2px 10px 2px 8px; min-height: 26px; border-radius: 999px; background: var(--surface); border: var(--bord); color: var(--fg); text-decoration: none; white-space: nowrap; }
a.chip:hover { border-color: var(--encre); }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.badge { display: inline-flex; align-items: center; justify-content: center; min-width: 44px; height: 28px; padding: 0 12px; border-radius: 999px; font: 800 13px var(--display); letter-spacing: .02em; white-space: nowrap; text-decoration: none; }
.badge.lg { height: 40px; min-width: 64px; font-size: 17px; }

/* Verdicts : trois formes distinctes, lisibles sans la couleur */
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; padding: 3px 11px; border-radius: 999px; white-space: nowrap; }
.tag.ok { background: var(--ok-soft); color: var(--ok-fg); }
.tag.ko { background: var(--ko-soft); color: var(--ko-fg); }
.tag.loi { background: var(--accent); color: var(--on-accent); }
.verdict { display: flex; gap: 16px; align-items: center; border-radius: var(--rayon); padding: 18px 20px; margin-top: 20px; }
.verdict.ok { background: var(--ok-soft); } .verdict.ko { background: var(--ko-soft); } .verdict.loi { background: var(--loi-soft); }
.v-ico { flex: none; width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; color: #fff; }
.verdict.ok .v-ico { background: var(--ok-fg); color: var(--ok-soft); } .verdict.ko .v-ico { background: var(--ko-fg); color: var(--ko-soft); } .verdict.loi .v-ico { background: var(--accent); color: var(--on-accent); }
.verdict b { display: block; font: 700 22px/1.2 var(--display); }
.verdict div > span { color: var(--muted); }

/* Accueil */
.steps { list-style: none; padding: 0; margin: 28px 0 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; counter-reset: etape; }
.steps li { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 2px 12px; counter-increment: etape; }
.steps li::before { content: counter(etape); grid-row: span 2; width: 32px; height: 32px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font: 800 15px var(--display); }
.steps b { font-family: var(--display); }
.steps span { color: var(--muted); font-size: 15px; }
.doors { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-top: 32px; }
.doors.trio { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.door { background: var(--surface); border: var(--bord); border-radius: var(--rayon); padding: 18px; text-decoration: none; color: var(--fg); display: grid; gap: 6px; align-content: start; }
.door b { font: 700 19px var(--display); display: flex; justify-content: space-between; gap: 8px; }
.door b::after { content: "→"; color: var(--corail); }
.door span { color: var(--muted); font-size: 15px; }
/* Siégez : une carte par texte, puis la révélation du vrai vote */
.siege { background: var(--surface); border: var(--bord-encre); border-radius: var(--rayon); padding: 22px; box-shadow: var(--ombre); }
.siege h2 { margin: 0 0 8px; }
/* Avant la séance : ce qui vous attend reste visible en bas de l'écran pendant qu'on coche */
#questions:has(.pret) { position: sticky; bottom: 12px; z-index: 4; }
.siege.pret { margin: 20px 0 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 14px 18px; }
.siege.pret p { margin: 0; flex: 1 1 160px; font-size: 15px; }
.seance { padding: 22px; gap: 14px; border: var(--bord-encre); box-shadow: var(--ombre); }
.seance h2 { margin: 0; font-size: clamp(22px, 3.5vw, 30px); }
.seance-haut { display: grid; gap: 6px; }
/* En séance : les sujets se réduisent à une ligne, pour laisser toute la place au texte */
#app.en-seance .lead, .en-seance .bilan .filtres { display: none; }
.seance-sujets { display: none; }
.en-seance .seance-sujets { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin: 0 0 14px; font-size: 15px; color: var(--muted); }
/* Séance en cours : une seule colonne, rien d'autre que le texte ; le panneau des groupes revient à la fin */
.en-cours .bilan > div > .note, .en-cours #revel, .en-seance #historique { display: none; }
.historique { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.historique li { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; }
.en-seance .bilan { grid-template-columns: minmax(0, 760px); justify-content: center; }
/* En séance, le titre de la page reste lu par les lecteurs d'écran mais laisse sa place au texte */
.en-cours h1 { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.en-cours .seance-sujets { flex-wrap: nowrap; justify-content: space-between; font-size: 14px; margin-top: -8px; }
.en-cours .seance-sujets > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.en-cours .seance-sujets .lien-bouton { flex: none; }
/* Les étapes d'un texte : le texte, le débat, le vote, le résultat */
.etapes { display: flex; gap: 4px; list-style: none; margin: 0; padding: 0; font: 600 13px var(--body); color: var(--muted); }
.etapes li { flex: 1; border-top: 4px solid var(--line); padding-top: 6px; }
.etapes li.fait { border-color: var(--accent-soft); }
.etapes li[aria-current] { border-color: var(--accent); color: var(--fg); }
.seance-suite { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
.scrutin { display: grid; gap: 10px; border-top: var(--bord); padding-top: 14px; }
.scrutin h3 { margin: 0; }
.seance .btns button { flex: 1 1 120px; min-height: 52px; font-size: 17px; }
.seance-nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.seance-resume { font-size: 18px; margin: 0; }
.debat { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.replique { max-width: 88%; background: var(--bg); border: var(--bord); border-radius: 16px; padding: 10px 14px; display: grid; gap: 4px; animation: apparait .3s ease-out; }
.replique.pour { justify-self: start; border-bottom-left-radius: 4px; }
.replique.contre { justify-self: end; border-bottom-right-radius: 4px; }
.replique.presentation, .replique.gouvernement { max-width: 100%; }
.replique .orateur { font-size: 13px; font-weight: 700; color: var(--muted); display: flex; align-items: center; gap: 6px 8px; flex-wrap: wrap; }
.role-debat { font-size: 12px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--fg); background: var(--line); border-radius: 999px; padding: 2px 9px; }
.replique.pour .role-debat::before { content: "+ "; } .replique.contre .role-debat::before { content: "− "; }
.legende-debat { margin: 0 0 8px; }
.consensus { margin: 10px 0 0; font-weight: 700; background: var(--ok-soft); color: var(--ok-fg); border-radius: var(--rayon-s); padding: 8px 14px; }
.replique q { quotes: "« " " »"; font-size: 16px; }
.vivre { display: grid; gap: 10px; }
.lien-debat, .lien-theme { font-weight: 700; font-size: 14px; text-decoration: none; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 2px 10px; }
.lien-debat::before { content: "▶ "; font-size: 11px; }
.lien-debat:hover { background: var(--accent); color: var(--on-accent); }
.details-choix { display: grid; gap: 14px; background: var(--bg); border-radius: var(--rayon-s); padding: 16px; animation: apparait .35s ease-out; }
.details-choix h3 { font-size: 20px; }
.details-choix ul { margin: 4px 0 0; padding-left: 20px; }
.details-choix p { margin: 4px 0 0; }

<script>
// Groupes de toutes les législatures (GROUPES vient de donnees.js), dans l'ordre de l'hémicycle, de la gauche vers la droite.
// Un même sigle d'une législature à l'autre désigne le même groupe (SOC, LR, RN…).
const ORDRE_HEMICYCLE = ["FI", "LFI-NUPES", "LFI-NFP", "GDR-NUPES", "GDR", "ECOLO", "ECOS", "SOC", "EDS", "LT", "LIOT", "LAREM", "RE", "EPR",
  "DEM", "AGIR-E", "HOR", "UDI-I", "LR", "DR", "UDR", "RN", "NI"];
const ORDRE = ORDRE_HEMICYCLE.filter(g => GROUPES[g]).concat(Object.keys(GROUPES).filter(g => !ORDRE_HEMICYCLE.includes(g)));
// Les non-inscrits ne forment pas un groupe : chacun vote librement. Ils n'ont donc pas de « position », ne sont ni
// rangés dans un camp, ni comparés aux groupes ; on montre seulement le détail de leurs voix.
const GROUPES_VOTE = ORDRE.filter(g => g !== "NI");
const G = g => GROUPES[g] || { nom: g, c: "#6b707a", t: "#fff", periodes: {} };
// Les trois périodes couvertes, et ce qu'il faut savoir du rapport de force pour lire les votes
const PERIODES = {
  "17": { lib: "Depuis 2024", contexte: "Depuis 2024, aucun groupe n'a seul la majorité : un texte n'est adopté qu'avec les voix de plusieurs groupes." },
  "16": { lib: "2022-2024", contexte: "De 2022 à 2024, aucun groupe n'avait seul la majorité absolue ; Renaissance et ses alliés avaient une majorité relative." },
  "15": { lib: "2017-2022", contexte: "De 2017 à 2020, le groupe La République en marche avait à lui seul la majorité absolue ; ensuite, avec ses alliés." },
};
const POSITIONS = { Opposition: "groupe d'opposition", Minoritaire: "groupe minoritaire", Majoritaire: "groupe majoritaire" };
// Niveau de vérification des résumés et des sujets (voir CHARTE-NEUTRALITE.md)

// Position d'un groupe vis-à-vis du TEXTE (pas du scrutin) : quand le vote portait sur
// la suppression de l'article unique, voter « pour » revient à s'opposer au texte.
function votesGroupe(t, row) {
  let p = row.pour, c = row.contre;
  if (t.inverse) [p, c] = [c, p];
  return { p, c, a: row.abst, n: row.m - row.pour - row.contre - row.abst };
}
function stance(t, row) {
  const { p, c, a } = votesGroupe(t, row);
  if (!(p + c + a)) return "absent";
  const m = Math.max(p, c, a);
  if ([p, c, a].filter(x => x === m).length > 1) return "divise";   // égalité : pas de position majoritaire
  return m === p ? "soutien" : m === c ? "opposition" : "abstention";
}
function totals(t) {
  let pour = t.pour, contre = t.contre;
  if (t.inverse) [pour, contre] = [contre, pour];
  const membres = t.groupes.reduce((s, g) => s + g.m, 0);
  // Absents : membres des groupes moins leurs votants. Les voix que l'open data ne rattache à aucun groupe (groupesIncomplets) n'y entrent pas.
  const votants = t.groupes.reduce((s, g) => s + g.pour + g.contre + g.abst, 0);
  return { pour, contre, abst: t.abst, membres, absents: membres - votants, adopte: pour > contre, ecart: Math.abs(pour - contre) };
}
// « C'est une loi » seulement si ce vote l'a adopté : un texte rejeté ici peut devenir une loi plus tard

const dernierVote = {};
TEXTES.forEach(t => { if (!dernierVote[t.dossier] || dernierVote[t.dossier] < t.date) dernierVote[t.dossier] = t.date; });
const estLoi = t => t.loi && totals(t).adopte && dernierVote[t.dossier] === t.date;
// Tous les votes d'un même texte (ses lectures), du premier au dernier
const VOTES_DOSSIER = {};
TEXTES.forEach(t => (VOTES_DOSSIER[t.dossier] ||= []).push(t));
Object.values(VOTES_DOSSIER).forEach(vs => vs.sort((a, b) => a.date.localeCompare(b.date)));

// Hémicycle : un point par député, rangés de la gauche vers la droite par groupe, en rangées concentriques.
// blocs : pour chaque groupe, ses points par lots [attributs du cercle, nombre] ; il est placé dans l'ordre de l'hémicycle.
// lien : chaque groupe mène à sa fiche (la légende sous l'hémicycle reste la version accessible au clavier).
function hemicycle(blocs, { aria, centre, sous = "", tete = "", pied = "", lien = false }) {
  const N = blocs.reduce((s, b) => s + b.lots.reduce((n, [, k]) => n + k, 0), 0), rangs = 12, r0 = .4, S = 230;
  const rayons = Array.from({ length: rangs }, (_, i) => r0 + (1 - r0) * i / (rangs - 1));
  const somme = rayons.reduce((a, b) => a + b, 0);
  const parRang = rayons.map(r => Math.round(N * r / somme));
  parRang[rangs - 1] += N - parRang.reduce((a, b) => a + b, 0);
  const sieges = [];
  rayons.forEach((r, i) => { const n = parRang[i]; for (let k = 0; k < n; k++) sieges.push({ r, a: Math.PI * (1 - k / (n - 1)) }); });
  sieges.sort((u, v) => v.a - u.a || u.r - v.r);

  // pour laisser un léger espace vide entre deux groupes voisins, sur toutes les rangées
  const ordre = ORDRE.map(g => blocs.find(x => x.g === g)).filter(b => b && b.lots.some(([, k]) => k > 0));
  const ecart = .016, serre = (Math.PI - (ordre.length - 1) * ecart) / Math.PI;
  let i = 0, dessin = "";
  const bornes = [];
  ordre.forEach((b, rang) => {
    const g = b.g, debut = i, decale = (ordre.length - 1 - rang) * ecart, angle = j => sieges[j].a * serre + decale;
    let seg = "";
    b.lots.forEach(([attr, k]) => {
      for (let j = 0; j < k && i < sieges.length; j++, i++) { const a = angle(i);
        seg += `<circle ${attr} cx="${(sieges[i].r * Math.cos(a) * S).toFixed(1)}" cy="${(-sieges[i].r * Math.sin(a) * S).toFixed(1)}" r="5.2"/>`; }
    });
    if (i - debut >= 15) {
      const am = (angle(debut) + angle(i - 1)) / 2, R = 1.09 * S;
      const x = R * Math.cos(am), y = -R * Math.sin(am), anc = Math.abs(x) < 30 ? "middle" : x < 0 ? "end" : "start";
      seg += `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="${anc}">${g}</text>`;
    }
    dessin += lien ? `<a href="#groupe/${g}" data-g="${g}" tabindex="-1">${seg}</a>` : seg;
    if (i > debut) bornes.push({ g, de: angle(debut), a: angle(i - 1) });
  });
  // La frontière entre deux groupes voisins est un rayon, au milieu de l'espace qui les sépare
  const ri = (r0 - .04) * S, re = 1.04 * S, pt = (r, t) => `${(r * Math.cos(t)).toFixed(1)} ${(-r * Math.sin(t)).toFixed(1)}`;
  const frontieres = bornes.slice(1).map((b, k) => (bornes[k].a + b.de) / 2);
  // Cliquable : sous les points, une part d'anneau par groupe couvre aussi les vides entre eux (le survol ne clignote pas)
  const zones = lien ? bornes.map((b, k) => {
    const A = k ? frontieres[k - 1] : Math.PI, B = k < bornes.length - 1 ? frontieres[k] : 0;
    return `<a href="#groupe/${b.g}" data-g="${b.g}" tabindex="-1"><path class="zone" d="M${pt(re, A)} A${re} ${re} 0 0 1 ${pt(re, B)} L${pt(ri, B)} A${ri} ${ri} 0 0 0 ${pt(ri, A)}Z"/></a>`;
  }).join("") : "";
  return `<div class="hemi${lien ? " cliquable" : ""}">${tete}<svg viewBox="-300 -262 600 280" ${lien ? `aria-hidden="true"` : `role="img" aria-label="${aria}"`}>
    ${zones}${dessin}<text class="centre" x="0" y="${sous ? -24 : -6}" text-anchor="middle">${centre}</text>${sous ? `<text class="sous" x="0" y="-2" text-anchor="middle">${sous}</text>` : ""}</svg>${pied}</div>`;
}
// Hémicycle d'un vote : chaque député coloré selon son vote
function hemicycleVote(t) {
  const blocs = t.groupes.map(row => { const v = votesGroupe(t, row); return { g: row.g, lots: [[`class="s-p"`, v.p], [`class="s-a"`, v.a], [`class="s-c"`, v.c], [`class="s-n"`, v.n]] }; });

    pied: `${legende}<p class="meta" style="text-align:center;margin:6px 0 0">Chaque point est un député.</p>` });
}
// Hémicycle d'une période : chaque député à la couleur de son groupe

// Le parcours d'un texte voté plusieurs fois : chaque lecture, puis le vote de chaque groupe à chaque lecture.

    .filter(m => m && m.d >= 4).sort((x, y) => y.d - x.d).slice(0, 4);
  const ecart = x => `${x.adopte ? "+" : "−"}${x.ecart}`, moisCourt = d => new Date(d + "T12:00").toLocaleDateString("fr-FR", { month: "short", year: "2-digit" });

        <span>${v === t ? `<b>${lecture(v) || "vote"}</b> <span class="meta">(ce vote)</span>` : `<a href="#texte/${v.id}">${lecture(v) || "vote"}</a>`}</span>

    <p>Entre le premier vote (${fdateCourte(premier.date)}) et le dernier (${fdateCourte(dernier.date)}), l'écart entre « pour » et « contre » est passé de <b>${ecart(s1)}</b> à <b>${ecart(s2)}</b> voix.${mouvements.length ? " Les groupes dont les voix ont le plus bougé :" : ""}</p>
    ${mouvements.length ? `<ul class="mouvements">${mouvements.map(m => `<li>${chip(m.g)}<span>${[ecartVoix(m.b.p - m.a.p, "pour"), ecartVoix(m.b.c - m.a.c, "contre")].filter(Boolean).join(", ")}</span></li>`).join("")}</ul>` : ""}
    <h3 class="eyebrow" style="margin:20px 0 8px">Le vote de chaque groupe, lecture après lecture</h3>
    <div class="evol-tete" aria-hidden="true"><span></span><span class="evol-barres">${vs.map(v => `<span>${moisCourt(v.date)}</span>`).join("")}</span></div>

      const pos = vs.map(v => { const r = v.groupes.find(x => x.g === g); return r && stance(v, r); }).filter(Boolean).filter((p, k, a) => p !== a[k - 1]);

// Les arguments des deux camps (voir CHARTE-NEUTRALITE.md) : même forme des deux côtés, sans couleur de camp

// Groupes rangés par position sur un vote, dans l'ordre de l'hémicycle
function camps(t) {
  return ["soutien", "opposition", "abstention", "divise"].map(st => {
    const gs = GROUPES_VOTE.filter(g => { const r = t.groupes.find(x => x.g === g); return r && stance(t, r) === st; });
    if ((st === "abstention" || st === "divise") && !gs.length) return "";
    return `<div class="row camp"><span class="pos ${st}">${LIB[st]}</span>${gs.map(g => chip(g)).join("") || `<span class="meta">aucun groupe</span>`}</div>`;

// Écart sous lequel un vote est signalé comme serré : quelques sièges suffisent à le faire basculer
const ECART_SERRE = 30;

function ligneTexte(t, { avecAuteur = true, datee = false, voteDe = null, avecResume = false } = {}) {

const MOIS_LONG = d => new Date(d + "T12:00").toLocaleDateString("fr-FR", { month: "long", year: "numeric" });
// Une liste de textes (du plus récent au plus ancien), et la mention IA une seule fois.
// Intertitres adaptés à la densité : par mois si la liste est dense, par année sinon ; si même les années ne
// regroupent presque rien (liste filtrée très clairsemée), pas d'intertitre et la date revient sur chaque carte.
function regrouper(ts, cle) {
  const g = [];
  ts.forEach(t => { const k = cle(t); if (!g.length || g[g.length - 1].k !== k) g.push({ k, d: t.date, ts: [] }); g[g.length - 1].ts.push(t); });
  return g;
}
function listeTextes(ts, opts) {
  const parMois = regrouper(ts, t => t.date.slice(0, 7)), parAn = regrouper(ts, t => t.date.slice(0, 4));
  const groupes = ts.length >= 2 * parMois.length ? parMois.map(g => ({ ...g, titre: MOIS_LONG(g.d) }))
    : ts.length >= 2 * parAn.length ? parAn.map(g => ({ ...g, titre: g.k }))
    : [{ titre: null, ts }];
  const datee = !groupes[0].titre;
  return `${ts.some(t => t.niveau === "ia") ? `<p class="note-ia">Titres et résumés rédigés par IA, pas encore vérifiés par un humain, sauf mention « relu ».</p>` : ""}
    <div class="liste-textes">${groupes.map(g => `${g.titre ? `<h3 class="mois">${g.titre}</h3>` : ""}<ul class="lignes">${g.ts.map(t => ligneTexte(t, { ...opts, datee })).join("")}</ul>`).join("")}</div>`;
}
// L'étape du parcours du texte, en mots simples (l'intitulé officiel est sur la fiche)
const LECTURES = { "texte de la commission mixte paritaire": "accord députés-sénateurs", "texte de la commission paritaire": "accord députés-sénateurs",

// Vote décisif : sans les voix de ce groupe, le résultat aurait été inverse.
// Adopté : sans ses « pour », il n'y aurait plus eu de majorité. Rejeté : sans ses « contre », le texte serait passé.
// Les abstentions et les absents ne comptent pas (le résultat se joue entre « pour » et « contre »).
function decisif(t, g) {
  const r = t.groupes.find(x => x.g === g); if (!r) return null;
  const v = votesGroupe(t, r), s = totals(t);
  if (s.adopte) return v.p && s.pour - v.p <= s.contre ? "adopte" : null;
  return v.c && s.pour > s.contre - v.c ? "rejete" : null;
}
// Un texte par dossier (son dernier vote retenu) : un texte voté en plusieurs lectures ne compte qu'une fois
const parDossier = ts => Object.values(ts.reduce((m, t) => { if (!m[t.dossier] || m[t.dossier].date < t.date) m[t.dossier] = t; return m; }, {}))
  .sort((a, b) => b.date.localeCompare(a.date));

function repartitionAuteurs(ts) {
  const ds = parDossier(ts), gouv = ds.filter(t => t.auteurCourt === "Gouvernement").length, senat = ds.filter(t => t.auteurCourt === "Sénat").length;

      <div class="row"><span class="eyebrow">${t.theme}</span>${t.transversaux.map(th => `<a class="lien-theme" href="#sujet/${encodeURIComponent(th)}">${th}</a>`).join("")}</div>
      <h1 style="margin-top:8px">${t.titre}</h1>
      <p class="lead">${t.type === "solennel"
        ? `Proposé par ${auteurNom(t)}. L'Assemblée en a fait l'un de ses grands votes (vote solennel), le ${fdate(t.date)}${(l => !l ? "" : l.startsWith("accord") ? `, sur l'${l}` : `, en ${l}`)(lecture(t))}.`
        : (n => `Proposé par ${t.groupe ? `le groupe ${badge(t.groupe)} ${G(t.groupe).nom}` : t.auteur}${n ? `, mis au programme ${n.groupe === t.groupe ? "par ce groupe" : `par le groupe ${G(n.groupe).nom}`} pendant <a href="#niche/${n.date}">sa journée réservée (niche) du ${fdate(n.date)}</a>` : `, voté le ${fdate(t.date)}`}.`)(NICHES.find(x => x.date === t.date))}</p>
      ${t.titreOfficiel !== t.titre ? `<p class="meta">Titre officiel : ${t.titreOfficiel}</p>` : ""}
      ${verdict(t)}
      <div class="clair">
        <div><div class="eyebrow">En clair</div><p>${t.enClair || `Résumé à venir. En attendant : ${ext(urlDossier(t), "le texte et son parcours sur le site de l'Assemblée")}.`}</p></div>
        ${t.concerne ? `<div><div class="eyebrow">Qui est concerné</div><p>${t.concerne}</p></div>` : ""}
      </div>
      ${t.enClair ? `<p class="note">${NIVEAUX[t.niveau] || ""}</p>` : ""}
      ${t.debat ? (autre => `<h2 id="le-debat" tabindex="-1">${autre ? `Le débat, lors d'un autre examen du texte` : t.debat.consensuel ? "Le débat" : "Pourquoi ce résultat&nbsp;? Le débat"}</h2>
        <p class="meta">${autre ? `Ce débat a eu lieu le ${fdate(t.debat.date)}, lors d'un autre examen de ce texte. Le vote présenté ici date du ${fdate(t.date)}.`
          : t.debat.consensuel ? "Ce qui a été dit en séance, avant le vote." : "Ce qu'ont dit les deux camps en séance, à égalité, avant le vote."}</p>${repliques(t, { nomme: true })}
        <p class="note">Extraits exacts du compte rendu (${t.debat.comptesRendus.map(ref => ext(urlCompteRendu(ref, t.leg), `séance du ${fdate(t.debat.date)}`)).join(", ")}). Choix fait par IA, citations vérifiées mot pour mot, pas encore relu par un humain.</p>`)(t.debat.date !== t.date) : ""}
      ${mesuresTexte(t)}
      ${t.arguments ? `<h2>Les arguments des deux camps</h2>${argsGrid(t)}
        <p class="note">Arguments avancés pendant les débats, rapportés sans jugement. Sources : ${t.arguments.sources.map(x => ext(x.url, x.label)).join(", ")}.</p>` : ""}
      <h2>Le vote des députés</h2>
      <div class="duel">
        <div class="duel-nums"><span class="p">${s.pour}<small>pour</small></span><span class="c">${s.contre}<small>contre</small></span></div>
        <div class="duel-bar"><i style="width:${(100 * s.pour / exprimes).toFixed(1)}%;background:var(--jauge-pour)"></i><i style="width:${(100 * s.contre / exprimes).toFixed(1)}%;background:var(--jauge-contre)"></i><span class="mid" title="Majorité"></span></div>
        <span class="meta">Le trait marque la majorité : le texte passe s'il a plus de « pour » que de « contre ». ${s.abst} abstention${s.abst > 1 ? "s" : ""}, qui ne comptent pas.</span>
      </div>
      <div class="facts">
        <div class="fact"><b>${s.ecart}</b><span>voix d'écart entre les deux camps</span></div>
        <div class="fact"><b>${s.absents}</b><span>députés sur ${s.membres} n'ont pas voté</span></div>
      </div>
      ${VOTE_SUR[t.voteSur] ? `<p class="note">${VOTE_SUR[t.voteSur][1]}</p>` : ""}
      ${hemicycleVote(t)}
      <h2>Groupe par groupe</h2>
      ${t.groupesIncomplets ? (x => `<p class="note">Les données officielles de l'Assemblée ne détaillent pas le vote du groupe ${x.groupes.join(", ")} sur ce scrutin : ${x.voixNonVentilees.pour} voix pour, ${x.voixNonVentilees.contre} contre et ${x.voixNonVentilees.abst} abstentions ne sont rattachées à aucun groupe. Elles comptent dans le résultat, pas dans le détail ci-dessous.</p>`)(t.groupesIncomplets) : ""}
      <div class="grp-list">${rows.map(r => {
        const st = stance(t, r), v = votesGroupe(t, r), pres = Math.round(100 * (v.p + v.c + v.a) / r.m);
        return `<div class="grp">${chip(r.g)}${r.g === "NI" ? `<span class="pos absent">Chacun vote librement</span>` : `<span class="pos ${st}">${LIB[st]}</span>`}${bar(v.p, v.c, v.a, v.n)}<span class="pct">${pres} %</span>
          <span class="num">${v.p} pour · ${v.c} contre · ${v.a} abst. · ${v.n} n'ont pas voté (participation ${pres} %)</span></div>`;
      }).join("")}</div>
      <p class="note">Position du groupe : le choix le plus fréquent parmi ses députés qui ont voté. Sources sur le site de l'Assemblée nationale : ${ext(urlVote(t.scrutin, t.leg), `vote n° ${t.scrutin}`)}, ${ext(urlDossier(t), "le texte et son parcours")}.</p>
      ${parcoursTexte(t)}
      ${appelJeu(t.theme)}`;
  },
  groupe(g) {
    const Gx = GROUPES[g] || { nom: g, c: "#6b707a", t: "#fff", periodes: {} };
    const portes = TEXTES.filter(t => t.groupe === g).sort((a, b) => b.date.localeCompare(a.date));
    const autres = TEXTES.filter(t => t.groupe !== g && t.groupes.some(r => r.g === g)).sort((a, b) => b.date.localeCompare(a.date));
    const pres = TEXTES.map(t => t.groupes.find(r => r.g === g)).filter(Boolean);
    const presMoy = pres.length ? Math.round(100 * pres.reduce((s, r) => s + (r.pour + r.contre + r.abst) / r.m, 0) / pres.length) : null;
    // Son poids dans l'hémicycle, en deux temps : ses propres textes, puis les textes des autres où ses voix ont décidé
    const sesTextes = parDossier(portes), adoptes = sesTextes.filter(t => portes.some(x => x.dossier === t.dossier && totals(x).adopte));
    const lois = sesTextes.filter(t => t.loi).length;
    const aide = parDossier(autres.filter(t => decisif(t, g) === "adopte")), bloque = parDossier(autres.filter(t => decisif(t, g) === "rejete"));
    // accord avec les autres groupes, sur les textes où les deux ont voté
    const ni = g === "NI";
    const accords = ni ? [] : GROUPES_VOTE.filter(o => o !== g).map(o => {
      let same = 0, n = 0;
      TEXTES.forEach(t => {
        const a = t.groupes.find(r => r.g === g), b = t.groupes.find(r => r.g === o);
        if (!a || !b) return;
        const sa = stance(t, a), sb = stance(t, b);
        if (sa === "absent" || sb === "absent") return;
        n++; if (sa === sb) same++;
      });
      return { o, pct: n ? Math.round(100 * same / n) : null, n };
    }).filter(x => x.pct !== null).sort((x, y) => y.pct - x.pct);
    const niches = NICHES.filter(n => n.groupe === g).sort((a, b) => b.date.localeCompare(a.date));
    return `${retour("#groupes", "Les groupes")}
      <div class="party-head" style="--pc:${Gx.c}">
        <div class="row" style="gap:14px">${badge(g, "lg")}<h1>${Gx.nom}</h1></div>
        ${(() => {
          // Contexte de chaque période : sièges en fin de période (ou aujourd'hui), position officielle quand elle est connue
          const legs = Object.keys(Gx.periodes).sort().reverse();
          return legs.map(leg => { const p = Gx.periodes[leg];
            return `<p class="contexte"><b>${PERIODES[leg].lib} : ${p.deputes} députés sur 577</b>, soit ${Math.round(100 * p.deputes / 577)} % des sièges${POSITIONS[p.position] ? `, ${POSITIONS[p.position]}` : ""}. ${PERIODES[leg].contexte}</p>`; }).join("")
            + (ni ? "" : `<p class="contexte">Les textes mis au programme pendant les journées réservées (niches), qui reviennent aux groupes d'opposition et minoritaires, sont rarement adoptés.</p>`);
        })()}
        <div class="stats">
          ${ni && !sesTextes.length ? "" : `<div class="stat"><div class="meta">Ses textes mis au vote, adoptés par l'Assemblée</div><span class="big">${adoptes.length} / ${sesTextes.length}</span><div class="meta">dont ${pluriel(lois, "devenu")} loi</div></div>`}
          ${ni ? "" : `<div class="stat"><div class="meta">Textes des autres adoptés : ses voix ont été décisives</div><span class="big">${aide.length}</span></div>
          <div class="stat"><div class="meta">Textes des autres rejetés : ses voix ont été décisives</div><span class="big">${bloque.length}</span></div>`}
          <div class="stat"><div class="meta">Participation moyenne aux votes</div><span class="big">${presMoy ?? "–"} %</span></div>
        </div>
        ${ni ? `<p class="contexte">Les non-inscrits ne forment pas un groupe : ce sont des députés qui n'ont rejoint aucun groupe, souvent de bords très différents. Chacun vote librement. Le site ne leur attribue donc pas de position commune et ne les compare pas aux groupes : il montre le détail de leurs voix sur chaque texte.</p>` : ""}
      </div>
      ${ni && !sesTextes.length ? "" : `<h2>1. Ce qu'il a proposé</h2>
      ${sesTextes.length ? `<p class="meta">${pluriel(sesTextes.length, "texte")} mis au vote, lors de ses journées réservées ou d'un vote solennel, dont ${adoptes.length} adopté${adoptes.length > 1 ? "s" : ""} par l'Assemblée et ${pluriel(lois, "devenu")} loi. Les textes de ses journées réservées qui n'ont pas pu être votés, faute de temps, sont dans le programme de chaque journée, plus bas.</p>${listeTextes(portes, { avecAuteur: false })}` : `<p class="meta">Aucun texte de ce groupe sur le site pour l'instant.</p>`}`}
      ${ni ? "" : `<h2>2. Les textes des autres où ses voix ont fait la différence</h2>
      <p class="meta">Sans les voix de ce groupe, le résultat aurait été inverse. Plus un groupe a de sièges, plus souvent ses voix décident : c'est le nombre de députés qui compte. <a href="#methode">Comment c'est calculé</a></p>
      <details class="depli"><summary>Adoptés grâce à ses voix « pour » <span>· ${pluriel(aide.length, "texte")}</span></summary>${aide.length ? listeTextes(aide) : `<p class="meta">Aucun.</p>`}</details>
      <details class="depli"><summary>Rejetés par ses voix « contre » <span>· ${pluriel(bloque.length, "texte")}</span></summary>${bloque.length ? listeTextes(bloque) : `<p class="meta">Aucun.</p>`}</details>`}
      ${(() => { const r = repartitionMesures(sesTextes); return r.classes ? `<h2>3. Ce que font les textes qu'il a proposés</h2>
        <p class="meta">Le mécanisme utilisé par chacun de ses ${pluriel(r.classes, "texte")} mis au vote et classé, lu dans ses articles. Un texte peut en combiner plusieurs. Le site ne dit pas si c'est bien ou mal : à chacun d'en juger. <a href="#methode">Comment c'est classé</a></p>
        <div class="repartition">${r.lignes.map(l => `<div><b>${l.n}</b><span>${MESURES[l.m]}</span></div>`).join("")}</div>
        ${sesTextes.some(t => t.mesuresNiveau === "ia") ? `<p class="note">Classement attribué par IA, pas encore vérifié par un humain.</p>` : ""}` : ""; })()}
      ${niches.length ? `<h2>Ses journées réservées</h2><p class="meta">Les jours où ce groupe a choisi seul les textes discutés (sa « niche »), avec tout son programme.</p>
        <div class="list">${niches.map(n => { const b = bilanNiche(n); return `<a class="card" href="#niche/${n.date}"><b style="font:700 17px var(--display)">${fdate(n.date)}</b><span class="meta">${pluriel(b.total, "texte")} au programme · ${b.votes} voté${b.votes > 1 ? "s" : ""} · ${b.sansVote} sans vote faute de temps</span></a>`; }).join("")}</div>` : ""}
      <h2>${ni ? "Comment les non-inscrits ont voté sur les autres textes" : "Comment il a voté sur tous les autres textes"}</h2>
      ${(() => {   // filtres : qui a proposé le texte, et ce que ce groupe a voté
        const auteurs = [...ORDRE, "Gouvernement", "Sénat"].filter(a => autres.some(t => auteurDe(t) === a));
        const opt = (id, lib, tous, liste) => `<div><label for="${id}">${lib}</label><select id="${id}"><option value="">${tous}</option>${liste.map(([v, l]) => `<option value="${v}">${l}</option>`).join("")}</select></div>`;
        return `<form class="filtres filtres-vote" onsubmit="return false">${opt("fg-auteur", "Proposé par", "Tous les auteurs", auteurs.map(a => [a, a]))}${ni ? "" : opt("fg-vote", "Son vote", "Tous les votes", Object.entries(LIB))}</form>`;
      })()}
      <p class="meta" id="fg-nb" aria-live="polite"></p>
      <div id="votes-groupe"></div>
      ${ni ? "" : `<h2>Avec qui vote-t-il ?</h2>
      <p class="meta">Part des textes du site où les deux groupes ont pris la même position, parmi ceux où les deux ont voté.</p>
      <div>${accords.map(a => `<div class="score">${chip(a.o)}<div class="bar"><i style="width:${a.pct}%;background:${G(a.o).c}"></i></div><b>${a.pct} %</b></div>`).join("")}</div>`}`;
  },
  apropos() {
    const gh = "https://github.com/qui-a-vote-quoi/qui-a-vote-quoi.github.io";
    return `<div class="apropos"><h1>À propos</h1>
      <p class="lead">Qui a voté quoi montre, pour chaque texte examiné à l'Assemblée nationale, qui l'a proposé, ce qu'il change et ce que chaque groupe de députés a voté. Le site ne juge pas : à vous de vous faire votre avis.</p>
      <h2>Version de test</h2>
      <p>Vous voyez une version de test. Elle couvre les textes votés depuis 2017 : les grands votes de l'Assemblée (votes solennels) et les journées réservées aux groupes d'opposition et minoritaires. Les votes viennent directement des données officielles. Ce qui est rédigé l'est à trois niveaux, toujours indiqués :</p>
      <ul>
        <li><b>Résumé à venir</b> : le texte s'affiche avec son titre officiel et un lien vers le site de l'Assemblée.</li>
        <li><b>Rédigé par IA, non vérifié</b> : le résumé, le titre court et le sujet ont été rédigés par une intelligence artificielle à partir du texte officiel, et pas encore relus par un humain. Ils peuvent contenir des erreurs.</li>
        <li><b>Relu par un humain</b> : le résumé a été vérifié sur le texte officiel.</li>
      </ul>
      <p>De même, les journées réservées sont repérées automatiquement, puis vérifiées dans les comptes rendus de séance, par IA ou par un humain : c'est indiqué sur chacune.</p>
      <h2>Donner votre avis</h2>
      <p>${AVIS_URL ? `Ce qui est clair, ce qui ne l'est pas, ce qui vous manque : ${ext(AVIS_URL, "donnez votre avis")}. Ne donnez pas vos votes de la page « À vous de voter » : ils sont personnels.` : "Le moyen de donner votre avis arrive bientôt."}</p>
      <h2>D'où viennent les chiffres</h2>
      <ul>
        <li>Toutes les données viennent de l'${ext("https://data.assemblee-nationale.fr", "open data de l'Assemblée nationale")} : votes, textes, comptes rendus des séances. Elles sont mises à jour une fois par mois.</li>
        <li>La position de chaque groupe est recalculée à partir du nombre de ses députés qui ont voté pour, contre ou se sont abstenus : c'est le choix le plus fréquent parmi ceux qui ont voté.</li>
        <li>Les résumés et les sujets sont rédigés par le projet à partir des textes officiels, en suivant des règles de neutralité, détaillées dans <a href="#methode">notre méthode</a>. Le site ne classe pas les groupes et ne note pas leurs arguments.</li>

      </ul></div>`;

  methode() {
    const gh = "https://github.com/qui-a-vote-quoi/qui-a-vote-quoi.github.io";
    return `<div class="apropos"><h1>Notre méthode</h1>
      <p class="lead">Le site montre des faits et laisse chacun juger. Il ne dit jamais si un texte, un vote ou un groupe est bon ou mauvais. Voici comment il est fait.</p>
      <h2>Ce que le site ne fait pas</h2>
      <ul>
        <li>Il ne recommande aucun vote et ne soutient aucun groupe ni aucun parti.</li>
        <li>Il ne classe pas les groupes selon leur « réussite » : un texte passe d'abord parce que son groupe a la majorité. Les chiffres d'un groupe ne s'affichent que sur sa fiche, avec leur contexte (opposition ou majorité, nombre de députés, période).</li>
        <li>Il ne note pas les arguments et ne dit pas ce qui est vrai ou faux.</li>
        <li>Il reprend les faits, pas les accusations d'un camp : quand un texte n'est pas voté, il écrit « faute de temps avant minuit », pas « à cause de l'obstruction ».</li>
      </ul>
      <h2>Comment une loi est votée</h2>
      <ol class="steps">
        <li><b>Un texte est proposé</b><span>Par des députés, des sénateurs ou le gouvernement.</span></li>
        <li><b>Les députés votent</b><span>Pour, contre ou abstention. Certains ne viennent pas.</span></li>
        <li><b>Le Sénat vote aussi</b><span>Le texte devient une loi si les deux l'adoptent, ou si l'Assemblée a le dernier mot.</span></li>
      </ol>
      <p>Le site couvre les grands votes de l'Assemblée (votes solennels) et les journées réservées aux groupes d'opposition et minoritaires, depuis 2017.</p>
      <h2 id="ce-qui-manque" tabindex="-1">Les votes montrés, et ceux qui manquent</h2>
      <p>À l'Assemblée, un texte se vote de trois façons :</p>
      <ul>
        <li><b>À main levée</b> : c'est la façon habituelle. Le président de séance compte les bras levés ; on ne sait pas qui a voté quoi.</li>
        <li><b>Par scrutin public ordinaire</b>, quand un groupe ou le gouvernement le demande : les députés présents votent depuis leur siège, et le vote de chacun est publié. Souvent avec peu de monde.</li>
        <li><b>Par scrutin public solennel</b>, prévu à l'avance pour les textes importants : tous les députés peuvent venir voter.</li>
      </ul>
      <p>Le site montre tous les votes solennels, et les votes des journées réservées aux groupes d'opposition et minoritaires. Il ne montre pas encore les autres scrutins ordinaires sur un texte entier : environ 470 depuis 2017, souvent avec moins de 100 votants. Il ne peut pas montrer les textes adoptés à main levée, ni ceux adoptés sans vote avec l'article 49.3 de la Constitution.</p>
      <h2>Les votes</h2>
      <ul>
        <li>Ils viennent directement des ${ext("https://data.assemblee-nationale.fr", "données officielles de l'Assemblée nationale")}, mises à jour une fois par mois. Ils ne sont jamais rédigés ni retouchés.</li>
        <li>La position d'un groupe est le choix le plus fréquent parmi ses députés qui ont voté. Elle est recalculée à partir du décompte des voix.</li>
        <li>Quand le vote ne porte pas sur le texte entier (une motion de rejet, la suppression d'un article), la fiche l'explique et indique ce que veut dire « pour le texte ».</li>
        <li>Les groupes sont toujours présentés dans l'ordre de l'hémicycle, de la gauche vers la droite, avec la même mise en forme pour tous.</li>
        <li>Chaque fiche renvoie au vote officiel sur le site de l'Assemblée : chacun peut vérifier.</li>
      </ul>
      <h2>Le poids d'un groupe</h2>
      <p>Sur la fiche de chaque groupe, on montre les textes des autres où ses voix ont été décisives : sans elles, le résultat aurait été inverse. Pour un texte adopté, ses voix « pour » étaient décisives si, en les retirant, il n'y avait plus de majorité. Pour un texte rejeté, ses voix « contre » l'étaient si, en les retirant, le texte serait passé. Les abstentions et les absents ne sont pas comptés. Un texte voté en plusieurs lectures compte une fois. Ces chiffres ne servent pas à classer les groupes : ils montrent que le nombre de sièges décide.</p>
      <h2>Ce que fait un texte</h2>
      <p>Chaque texte est classé selon le mécanisme qu'il utilise, lu dans ses articles : il crée ou réduit une aide, crée ou allège une sanction, crée ou lève une obligation, augmente ou baisse un impôt, organise les institutions, fixe un budget, approuve un accord international, ou exprime une reconnaissance sans effet juridique. Chaque mécanisme a son contraire, pour voir aussi ce qui se retire ou se simplifie. Ce classement décrit ; il ne juge pas : une même sanction sera vue comme protectrice par les uns, répressive par les autres. La grille complète est ${ext("https://github.com/qui-a-vote-quoi/qui-a-vote-quoi.github.io/blob/main/GRILLE-MESURES.md", "publique")}.</p>
      <h2 id="sujets" tabindex="-1">Les sujets</h2>
      <p>Chaque texte est rangé dans un seul sujet principal (Santé, Logement…), attribué par IA à partir du texte. Certains thèmes traversent plusieurs sujets : un texte sur l'IVG est rangé dans Santé, mais il compte aussi pour l'égalité entre les femmes et les hommes. Pour ces thèmes, la liste n'a pas été fixée à l'avance. Une IA a d'abord noté, texte par texte, les enjeux de chacun ; ces enjeux ont ensuite été regroupés, et un thème n'a été retenu que s'il réunit assez de textes répartis dans au moins trois sujets principaux. Enfin, chaque texte a été relu avec la liste retenue : il n'y est rangé que si c'est son objet principal, et les cas en doute ont été tranchés par un humain. Les thèmes retenus : ${Object.keys(TRANSVERSAUX).join(", ")}.</p>
      <h2>Les journées réservées (« niches »)</h2>

const lireSeances = () => lirePref("seances", []);
function enregistrerSeance() {
  const rep = load(), votes = Object.fromEntries(seance.ids.filter(id => id in rep).map(id => [id, rep[id]]));
  if (seance.archive || seance.enregistree || !Object.keys(votes).length) return;
  seance.enregistree = true;
  ecrirePref("seances", [{ date: new Date().toISOString().slice(0, 10), ids: seance.ids, votes }, ...lireSeances()].slice(0, 10));
}
function historique() {
  const ss = lireSeances();
  if (!ss.length) return "";
  return `<details class="args-mini"><summary>Vos séances précédentes (${ss.length})</summary><ul class="historique">${ss.map((x, k) => {
    const { answered, scores } = scoresBilan(x.votes), top = answered.length && scores[0].classe && scores[0].pct > 0 ? scores[0] : null;
    return `<li><span>${fdateCourte(x.date)} · ${pluriel(Object.keys(x.votes).length, "vote")}${top ? ` · plus proche : ${top.g} (${top.pct} %)` : ""}</span>
      <button type="button" class="lien-bouton" data-revoir="${k}">Revoir</button></li>`;
  }).join("")}</ul></details>`;
}
function allerA(i) {
  const t = byId(seance.ids[i]);
  Object.assign(seance, { i, revele: !!t && t.id in load(), etape: "texte", details: false, repl: 0 });
  if (i >= seance.ids.length) enregistrerSeance();
  majQuestions();
  ($("#revelation") || $("#q-titre") || $("#fin-seance"))?.focus();
}
function load() { try { return JSON.parse(localStorage.getItem("bilan") || "{}"); } catch { return {}; } }
function save(r) { try { localStorage.setItem("bilan", JSON.stringify(r)); } catch {} }

function scoresBilan(rep) {
  const answered = BILAN.filter(t => rep[t.id] === 1 || rep[t.id] === -1);
  const scores = GROUPES_VOTE.map(g => {
    let acc = 0, des = 0, abs = 0;
    answered.forEach(t => {
      const r = t.groupes.find(x => x.g === g); if (!r) return;
      const st = stance(t, r); if (st === "absent") return;
      if (st === "abstention" || st === "divise") abs++;   // ni comme vous, ni contre vous
      else if ((st === "soutien") === (rep[t.id] === 1)) acc++; else des++;
    });
    const n = acc + des + abs;
    return { g, acc, des, abs, n, pct: n ? Math.round(100 * acc / n) : null };
  });
  // Un groupe n'est classé que s'il a voté sur au moins la moitié des textes que vous avez votés :
  // sinon un groupe souvent absent pourrait arriver en tête sur un seul vote.
  const seuil = Math.ceil(answered.length / 2);
  scores.forEach(s => s.classe = s.n > 0 && s.n >= seuil);
  // Tant que rien n'est voté, on garde l'ordre de l'hémicycle
  if (answered.length) scores.sort((a, b) => (b.classe - a.classe) || ((b.pct ?? -1) - (a.pct ?? -1)));
  return { answered, scores, seuil };
}
// Le panneau des groupes n'apparaît que s'il a quelque chose à dire : pas avant le premier vote, pas pendant la séance
// Les résultats portent sur la séance qui vient de se terminer, pas sur tout l'historique : chaque séance a les siens.
// Les votes restent gardés sur l'appareil, seulement pour ne pas reproposer un texte déjà voté.
const seanceFinie = () => !!seance && seance.i >= seance.ids.length;
function repSeance() {
  const rep = seance?.votes || load();
  return seanceFinie() ? Object.fromEntries(seance.ids.filter(id => id in rep).map(id => [id, rep[id]])) : {};
}
// Met à jour le panneau et les réponses sans redessiner la page : rien ne bouge sous le doigt
function majBilan() {
  const tous = load(), rep = repSeance(), { answered, scores } = scoresBilan(rep);
  document.querySelectorAll(".btns").forEach(bx => bx.querySelectorAll("button").forEach(b => {
    const on = tous[bx.dataset.id] === +b.dataset.v;
    b.classList.toggle("sel", on); b.setAttribute("aria-pressed", on);
  }));
  const top = answered.length && scores[0].classe && scores[0].pct > 0 ? scores[0] : null;
  const panel = $("#fin-resultats");
  if (panel) panel.innerHTML = `
    <div class="panel-head"><h2 class="eyebrow">Ont voté comme vous</h2><span class="meta">sur cette séance</span></div>
    <p class="panel-top">${top ? (() => {
      const ex = scores.filter(s => s.classe && s.pct === top.pct);
      return `<span>${ex.length > 1 ? "Les plus proches de vous, à égalité" : "Le plus proche de vous"} :</span> ${ex.map(s => chip(s.g, false)).join(" ")} <b>${top.pct} %</b>`;
    })() : answered.length ? "Aucun groupe n'a voté comme vous sur ces textes, pour l'instant." : "Votez sur un premier texte : les groupes qui ont voté comme vous s'affichent ici, en direct."}</p>
    ${answered.length ? `<p class="meta" style="margin:0;font-size:13px">Calculé sur ${answered.length > 1 ? `vos ${answered.length} votes` : "votre vote"} de cette séance.</p>` : ""}
    <div class="panel-scores">${scores.filter(s => s.n).map(s => `<div class="pscore${answered.length && !s.classe ? " hors" : ""}">${chip(s.g, false)}${s.n ? bar(s.acc, s.des, s.abs, 0) : bar(0, 0, 0, 1)}<b>${s.n ? s.pct + " %" : "–"}</b><span class="sur">${answered.length ? `sur ${s.n}` : ""}</span></div>`).join("")}</div>
    ${scores.some(s => answered.length && !s.classe) ? `<p class="meta" style="margin:0;font-size:13px">En grisé : groupes présents sur moins de la moitié des textes que vous avez votés. Ils ne sont pas classés.</p>` : ""}
    <div class="legend panel-legend"><span><i class="dot" style="background:var(--jauge-pour)"></i>A voté comme vous</span><span><i class="dot" style="background:var(--jauge-contre)"></i>A voté autrement</span><span><i class="dot" style="background:var(--jauge-abst)"></i>Abstention</span></div>`;
  const aimes = answered.filter(t => rep[t.id] === 1);
  const origine = {}; aimes.forEach(t => { const k = t.groupe || t.auteurCourt; origine[k] = (origine[k] || 0) + 1; });
  $("#revel").innerHTML = answered.length ? `<h2>Qui avait proposé quoi</h2>
    ${aimes.length ? `<div class="callout" style="margin-top:0;margin-bottom:12px"><b>Les textes pour lesquels vous avez voté pour</b> avaient été proposés par : ${Object.entries(origine).map(([g, n]) => `${GROUPES[g] ? chip(g) : `<span class="chip">${g}</span>`} ×${n}`).join(" ")}</div>` : ""}
    <div class="tablewrap"><table><thead><tr><th>Votre vote</th><th>Texte</th><th>Proposé par</th><th>Résultat</th></tr></thead><tbody>${answered.map(t => `<tr><td class="pos ${rep[t.id] === 1 ? "soutien" : "opposition"}">Vous : ${rep[t.id] === 1 ? "pour" : "contre"}</td><td><a href="#texte/${t.id}">${t.titre}</a></td><td>${auteurCourt(t)}</td><td>${issueTag(t)}</td></tr>`).join("")}</tbody></table></div>` : "";
}

// Lien retour : vers la page d'où l'on vient (comme le bouton précédent du navigateur), sinon vers la page parente.
// pile : les pages visitées avant celle-ci ; une page et ses sections (#…/debat) comptent pour une seule.
const page = h => h.replace(/^#/, "").replace(/\/(debat|qui-decide|ce-qui-manque|sujets)$/, "") || "accueil";
let pile = [], ici = { hash: location.hash, titre: "" };
const retour = (href, label) => {
  const p = pile[pile.length - 1];
  return p ? `<a class="back" href="${p.hash || "#accueil"}">← ${p.titre}</a>` : `<a class="back" href="${href}">← ${label}</a>`;
};
function render() {
  const [view, arg] = (location.hash.slice(1) || "accueil").split("/");   // #texte/<id>/debat : voir le gestionnaire hashchange
  if (view === "jouer") {   // #jouer/<sujet> : une séance sur ce sujet, lancée tout de suite
    ecrirePref("bilanChoix", { sujets: [decodeURIComponent(arg || "")], leg: "" });
    seance = null; history.replaceState(null, "", "#bilan");
    return render(), commencerSeance();
  }
  const fn = views[view] || views.accueil;
  app.innerHTML = fn(decodeURIComponent(arg || ""));
  // Titre de l'onglet propre à chaque vue (annoncé par les lecteurs d'écran)
  const h1 = app.querySelector("h1");
  document.title = view === "accueil" || !h1 ? "Qui a voté quoi" : `${h1.textContent} – Qui a voté quoi`;
  app.classList.remove("en-seance", "en-cours");
  // #bilan/<id> : une séance qui commence par ce texte, puis des textes au hasard
  if (view === "bilan" && arg && !seance && byId(decodeURIComponent(arg))) {
    const id = decodeURIComponent(arg), rep = load();
    seance = { tous: true, ids: [id, ...melanger(BILAN.filter(t => t.id !== id && !(t.id in rep))).slice(0, TAILLE_SEANCE - 1).map(t => t.id)] };
    allerA(0);
  } else if (view === "bilan") majQuestions();
  if (view === "sujets" || view === "sujet") majSujets();
  if (view === "groupe" && $("#votes-groupe")) { nbVotesGroupe = 30; majVotesGroupe(); }
  // Une fiche texte n'appartient à aucune rubrique du menu
  const rubrique = { groupes: "groupes", niche: "groupes", groupe: "groupes", sujets: "sujets", sujet: "sujets", juger: "sujets", bilan: "bilan" }[view];
  document.querySelectorAll("nav a").forEach(a => a.classList.toggle("on", a.dataset.nav === rubrique));
}
$("#maj").textContent = `Données de l'Assemblée nationale mises à jour le ${fdate(INFOS.miseAJour)}.`;
$("#skip").addEventListener("click", e => { e.preventDefault(); app.focus(); });
app.addEventListener("click", e => {
  const b = e.target.closest(".btns button");
  if (b) {
    const r = load(), id = b.parentElement.dataset.id, v = +b.dataset.v;
    r[id] = v; save(r); majBilan();
    if (seance && seance.ids[seance.i] === id) { seance.revele = true; afficherSeance(); $("#revelation")?.focus(); }
    // Une phrase courte pour les lecteurs d'écran, plutôt que la relecture de tout le panneau
    const { answered, scores } = scoresBilan(repSeance()), top = answered.length && scores[0].classe && scores[0].pct > 0 ? scores[0] : null;
    const ex = top ? scores.filter(x => x.classe && x.pct === top.pct).map(x => x.g).join(", ") : "";
    $("#annonce").textContent = `Vote enregistré.` + (top ? ` Plus proches de vous pour l'instant : ${ex}, ${top.pct} %.` : "");
    return;
  }
  if (e.target.dataset.periode) {
    periodeGroupes = e.target.dataset.periode; $("#hemi-groupes").innerHTML = hemicycleGroupes(periodeGroupes);
    $(`[data-periode="${periodeGroupes}"]`).focus(); return;
  }
  if (e.target.id === "sieger") { commencerSeance(); return; }
  if (e.target.id === "suivant" || e.target.id === "passer") { allerA(seance.i + 1); return; }
  if (e.target.id === "vers-debat") { seance.etape = "debat"; seance.repl ||= 1; afficherSeance(); $("#titre-debat")?.focus(); return; }
  if (e.target.id === "vers-vote") { seance.etape = "vote"; afficherSeance(); $("#titre-scrutin")?.focus(); return; }
  if (e.target.id === "replique-suivante") { seance.repl++; afficherSeance(); $("#derniere-replique")?.focus(); return; }
  if (e.target.id === "tout-le-debat") { seance.repl = Infinity; afficherSeance(); $("#derniere-replique")?.focus(); return; }
  if (e.target.id === "en-savoir-plus") { seance.details = true; afficherSeance(); $("#details-titre")?.focus(); return; }
  // Revenir au texte d'avant : s'il a été voté, on revoit son résultat ; s'il a été passé, on peut voter
  if (e.target.id === "precedent") { allerA(seance.i - 1); return; }
  if (e.target.id === "tous-sujets") {
    const cases = [...app.querySelectorAll("input[name=sujet]")], cocher = cases.some(c => !c.checked);
    cases.forEach(c => c.checked = cocher);
    ecrirePref("bilanChoix", { sujets: cocher ? cases.map(c => c.value) : [], leg: $("#periode-bilan").value });
    majQuestions(); return;
  }
  if (e.target.id === "changer-sujets") { seance = null; majQuestions(); app.querySelector("input[name=sujet]")?.focus(); return; }
  if (e.target.id === "autre-seance") { seance = null; commencerSeance(); if (!seance.ids.length) { seance = null; majQuestions(); } return; }
  if (e.target.id === "voir-plus-groupe") {
    const avant = nbVotesGroupe; nbVotesGroupe += 30; majVotesGroupe();
    document.querySelectorAll("#votes-groupe .ligne h3 a")[avant]?.focus(); return;
  }
  if (e.target.id === "voir-plus") {
    // Les textes ajoutés arrivent sous le bouton : le focus va au premier d'entre eux
    const avant = nbVisibles; nbVisibles += 30; majSujets();
    document.querySelectorAll("#resultats .ligne h3 a")[avant]?.focus(); return;
  }
  if (e.target.id === "effacer-filtres") {
    filtre = { q: "", leg: "", sujet: location.hash.startsWith("#sujet/") ? filtre.sujet : "", auteur: "" }; nbVisibles = 30;
    render(); $("#q").focus(); return;
  }
  if (e.target.dataset.revoir) {
    const x = lireSeances()[+e.target.dataset.revoir];
    seance = { ids: x.ids, votes: x.votes, archive: x.date, i: x.ids.length };
    majQuestions(); $("#fin-seance")?.focus(); return;
  }
  if (e.target.id === "reset") { e.preventDefault(); save({}); ecrirePref("seances", []); seance = null; majQuestions(); }
});
// Formulaires : filtres (Les textes), sujets et période (À vous de voter)
app.addEventListener("input", e => {
  if (e.target.id === "q") { filtre.q = e.target.value; nbVisibles = 30; majSujets(); }
});
app.addEventListener("change", e => {
  const champ = { periode: "leg", "f-sujet": "sujet", "f-auteur": "auteur" }[e.target.id];
  if (champ) { filtre[champ] = e.target.value; nbVisibles = 30; majSujets(); }
  if (e.target.id === "fg-auteur" || e.target.id === "fg-vote") { nbVotesGroupe = 30; majVotesGroupe(); }
  if (e.target.name === "sujet" || e.target.id === "periode-bilan") {
    const f = e.target.form;
    ecrirePref("bilanChoix", { sujets: [...f.querySelectorAll("input[name=sujet]:checked")].map(x => x.value), leg: f.querySelector("#periode-bilan").value });
    seance = null; majQuestions();
  }
});
function surligner(e) {
  const zone = e.target.closest?.(".hemi.cliquable"); if (!zone) return;
  const g = e.type === "mouseover" || e.type === "focusin" ? e.target.closest("[data-g]")?.dataset.g : null;
  zone.classList.toggle("un-groupe", !!g);
  zone.querySelectorAll("[data-g]").forEach(x => x.classList.toggle("on", x.dataset.g === g));
  const leg = periodeGroupes, n = g ? G(g).periodes[leg].deputes : Object.values(GROUPES).reduce((s, x) => s + (x.periodes[leg] && !x.periodes[leg].fin ? x.periodes[leg].deputes : 0), 0);
  zone.querySelector(".centre").textContent = n; zone.querySelector(".sous").textContent = g ? `députés ${g}` : "députés";
}
["mouseover", "mouseout", "focusin", "focusout"].forEach(t => app.addEventListener(t, surligner));
addEventListener("hashchange", () => {
  if (page(location.hash) !== page(ici.hash)) {
    if (pile.length && page(pile[pile.length - 1].hash) === page(location.hash)) pile.pop();
    else pile.push({ hash: ici.hash, titre: page(ici.hash) === "accueil" ? "Accueil" : app.querySelector("h1")?.textContent || "Retour" });
    ici = { hash: location.hash };
  }
  if (!location.hash.startsWith("#bilan")) seance = null;
  // Liens vers une section d'une page : #accueil/qui-decide, #methode/ce-qui-manque
  const ancre = { "#accueil/qui-decide": "#qui-decide", "#methode/ce-qui-manque": "#ce-qui-manque", "#methode/sujets": "#sujets" }[location.hash];
  if (ancre) { render(); const h = $(ancre); h.scrollIntoView(); h.focus({ preventScroll: true }); return; }
  if (location.hash.endsWith("/debat")) {
    render(); const h = $("#le-debat");
    if (h) { h.scrollIntoView(); h.focus({ preventScroll: true }); return; }
  }
  render(); scrollTo(0, 0);
  // Annonce la nouvelle vue : le focus va sur son titre principal
  const h1 = app.querySelector("h1");
  if (h1) { h1.setAttribute("tabindex", "-1"); h1.focus({ preventScroll: true }); }
});
render();
// Lien direct vers un débat : on y descend une fois la page chargée (le navigateur remet sinon la page en haut)
if (location.hash.endsWith("/debat")) addEventListener("load", () => setTimeout(() => $("#le-debat")?.scrollIntoView(), 0));
</script>
